name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify

  # Same sources and tests against Spring Boot 4 (Spring Framework 7). Releases are built on the
  # Boot 3.5 baseline; this job guarantees the published jars keep working on Boot 4.
  build-boot4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test on Spring Boot 4
        run: ./mvnw -B -ntp -Pspring-boot-4 verify

  # End-to-end and security tests in a real Spring Boot 4 application (H2 + Redis via Testcontainers),
  # run against the starter built from this commit.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install the starter from this commit
        run: ./mvnw -B -ntp install -DskipTests
      - name: Build and test the demo application against it
        run: |
          VERSION=$(./mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          ./mvnw -B -ntp -f examples/demo/pom.xml verify -Dbloomfilter.version="$VERSION"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
